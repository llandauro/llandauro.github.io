about_title: "About me"

about: |
  I first discovered robotics at McGill's Mobile Robotics Lab, testing a rover every week in the Gault Nature Reserve and editing a paper on off-trail navigation. I then joined McGill Robotics, where I built the computer vision system of an autonomous underwater vehicle.

  What ties my work together is the environment, and **marine environments** above all. I have labelled and analyzed images for a system that monitors fish populations at sea, and worked on tracing the microplastics found on turtle nesting beaches in Costa Rica.

  I also care about **empowering the Latin American community**: I am Director of Student Affairs at ALPFA Montreal and was co-president of McGill's Spanish and Latin-American Student Association.

  Away from the keyboard, I swim with the McGill Masters Swimming Club and study piano and composition.

