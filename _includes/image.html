{%- comment -%} One picture, nothing when no image is given. Parameters: item, caption (true to show it) {%- endcomment -%}
{%- if include.item.image and include.item.image != "" -%}
<figure class="figure">
        <div class="frame"><img src="{{ '/images/' | append: include.item.image | relative_url }}" alt="{{ include.item.alt | escape }}"{% if include.item.focus %} style="object-position: {{ include.item.focus | escape }}"{% endif %}></div>
        {%- if include.caption and include.item.caption and include.item.caption != "" %}
        <figcaption>{{ include.item.caption | escape }}</figcaption>
        {%- endif %}
      </figure>
{%- endif -%}
