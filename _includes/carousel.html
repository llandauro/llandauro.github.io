{%- comment -%} Sliding pictures. Parameters: pictures, ratio (width / height) {%- endcomment -%}
{%- if include.pictures and include.pictures.size > 0 -%}
<div class="carousel" role="group" aria-label="Image carousel" style="--ratio: {{ include.ratio }}">
        <div class="slides">
          {%- for item in include.pictures %}
          <img{% if forloop.first %} class="active"{% endif %} src="{{ '/images/' | append: item.image | relative_url }}" alt="{{ item.alt | escape }}"{% if item.caption and item.caption != "" %} data-caption="{{ item.caption | escape }}"{% endif %}>
          {%- endfor %}
        </div>
        <p class="caption" aria-live="polite">{{ include.pictures[0].caption | escape }}</p>
      </div>
{%- endif -%}
